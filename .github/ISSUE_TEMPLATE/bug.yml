name: Bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Descripción corta del problema.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Development build (Android)
        - Development build (iOS)
        - Emulador
        - Web
        - Otro
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
